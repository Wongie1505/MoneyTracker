<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTracker</title>
</head>
<body>

    <script>
        // Decide where to send the user: onboarding on first launch, home after that
        var saved = null;

        try {
            saved = JSON.parse(localStorage.getItem('moneytracker_v1'));
        } catch (e) {
            // Corrupt or missing data: treat as a new user
        }

        var onboarded = saved && saved.settings && saved.settings.onboarded;

        location.replace(onboarded ? 'home/home.html' : 'onboarding/onboarding.html');
    </script>
</body>
</html>
