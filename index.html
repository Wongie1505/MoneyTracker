<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f8a4c">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

    <script>
        // Decide where to send the user: onboarding on first launch, home after that
        function goToApp() {
            var saved = null;

            try {
                saved = JSON.parse(localStorage.getItem('moneytracker_v1'));
            } catch (e) {
                // Corrupt or missing data: treat as a new user
            }

            var onboarded = saved && saved.settings && saved.settings.onboarded;

            location.replace(onboarded ? 'home/home.html' : 'onboarding/onboarding.html');
        }

        // Register the service worker on the start page (PWABuilder checks here),
        // and only redirect once registration has finished
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('sw.js')
                .then(goToApp, goToApp);
        } else {
            goToApp();
        }
    </script>
</body>
</html>
