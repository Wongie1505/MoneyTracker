<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f8a4c">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png">
</head>

<body>

    <noscript>MoneyTracker needs JavaScript to run.</noscript>

    <script>
        // Decide where to send the user: onboarding on first launch, home after that
        function goToApp() {
            var saved = null;

            try {
                saved = JSON.parse(localStorage.getItem('moneytracker_v1'));
            } catch (e) {
                // Corrupt or missing data: treat as a new user
            }

            var onboarded = saved && saved.settings && saved.settings.onboarded;

            location.replace(onboarded ? 'home/home.html' : 'onboarding/onboarding.html');
        }

        // Register the service worker on the root page first, so it always happens
        // before the redirect. A failed registration must never block the app.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('sw.js')
                .catch(function () {
                    // Ignore: the app still works online without it
                })
                .then(goToApp);
        } else {
            goToApp();
        }
    </script>

</body>

</html>
