<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | MoneyTracker</title>

    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="home.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1f8a4c">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
</head>
<body data-page="home">

    <header>
        <h1>MoneyTracker</h1>
        <a class="gear" href="../settings/settings.html">⚙️</a>
    </header>

    <!-- Remaining money this month -->
    <div class="card">
        <div class="sub">Remaining to spend this month</div>
        <div class="big" id="rem"></div>
        <div class="sub" id="remsub"></div>
        <div class="bar"><i id="rembar"></i></div>
    </div>

    <!-- Income, spending, profit or loss -->
    <div class="split">
        <div class="card mini">
            <div class="sub">Income</div>
            <b class="pos" id="inc"></b>
        </div>
        <div class="card mini">
            <div class="sub">Spent</div>
            <b class="neg" id="exp"></b>
        </div>
        <div class="card mini">
            <div class="sub">Profit / loss</div>
            <b id="pl"></b>
        </div>
    </div>

    <h2>Budget buckets</h2>
    <div class="card" id="buckets"></div>

    <h2>Recent transactions</h2>
    <div class="card" id="recent"></div>

    <!-- Quick add button -->
    <a class="fab" href="../transactions/transactions.html">+</a>

    <script src="../shared/store.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="home.js"></script>
</body>
</html>
